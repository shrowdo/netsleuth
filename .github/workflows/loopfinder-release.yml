name: LoopFinder Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-loopfinder-exe:
    name: Build loop-finder.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build executables (runs tests first)
        shell: pwsh
        run: ./build.ps1 -Python python

      - name: Upload exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: loop-finder-windows-exe
          path: dist/*.exe

      - name: Attach exe to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/loop-finder.exe
            dist/netsleuth.exe
